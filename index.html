  <style>
    /* Print styles */
    @media print {
      .no-print { display: none !important; }
      .print-expand { display: block !important; }
      .step-card { break-inside: avoid; }
      body { font-size: 12px; }
      .print-full-width { max-width: 100% !important; }
    }

    /* Smooth transitions */
    .accordion-body {
      overflow: hidden;
      transition: max-height 0.25s ease, opacity 0.2s ease;
    }
    .accordion-body.closed {
      max-height: 0;
      opacity: 0;
    }
    .accordion-body.open {
      max-height: 2000px;
      opacity: 1;
    }

    /* Code block scroll */
    pre {
      white-space: pre;
      overflow-x: auto;
    }

    /* Scroll hint gradient */
    .scroll-fade::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 48px;
      background: linear-gradient(to right, transparent, white);
      pointer-events: none;
    }

    /* Step complete animation */
    @keyframes checkPop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .check-pop { animation: checkPop 0.3s ease forwards; }
  </style>
</head>

  // { [platformId]: Set<stepId> }
  completed: JSON.parse(localStorage.getItem('tl_completed') || '{}'),
  // { [platformId]: number } — active step index (0-based)
  activeStep: {},
  // { [faqIndex]: bool }
  faqOpen: {},
};

function saveCompleted() {
  // localStorage stores plain objects — convert Sets to arrays
  const out = {};
  for (const [k, v] of Object.entries(state.completed)) {
    out[k] = v instanceof Set ? [...v] : v;
  }
  localStorage.setItem('tl_completed', JSON.stringify(out));
}

function getCompleted(platformId) {
  const raw = state.completed[platformId];
  if (!raw) return new Set();
  if (raw instanceof Set) return raw;
  return new Set(raw);
}

// ─── ROUTER ─────────────────────────────────────────────────────────────────
function getRoute() {
  const hash = window.location.hash.replace('#', '') || '/';
  const [path, queryString] = hash.split('?');
  const params = {};
  if (queryString) {
    queryString.split('&').forEach(p => {
      const [k, v] = p.split('=');
      params[k] = v;
    });
  }
  const parts = path.split('/').filter(Boolean);
  if (parts.length === 0) return { page: 'home', params };
  if (parts[0] === 'migrate') return { page: 'migrate', params };
  if (parts[0] === 'setup' && parts[1]) return { page: 'platform', id: parts[1], params };
  if (parts[0] === 'setup') return { page: 'setup', params };
  return { page: 'home', params };
}

function navigate(path) {
  window.location.hash = path;
}

// ─── PLATFORM PAGE ───────────────────────────────────────────────────────────
function renderPlatform(id, params) {
  const platform = PLATFORMS.find(p => p.id === id);
  if (!platform) {
    return `
      ${renderHeader()}
      <main class="max-w-2xl mx-auto px-4 py-16 text-center">
        <h1 class="text-2xl font-bold text-[#001e45] mb-4">Platform not found</h1>
        <button data-link="/setup" class="bg-[#001e45] text-white px-6 py-2 rounded-lg">Back to setup</button>
      </main>
    `;
  }

  const completed = getCompleted(id);
  const totalSteps = platform.steps.length;
  const completedCount = completed.size;
  const allDone = completedCount === totalSteps;
  const pct = Math.round((completedCount / totalSteps) * 100);

  // Determine active step: from URL param, or first incomplete, or last
  let activeIdx = 0;
  if (params && params.step) {
    const stepId = parseInt(params.step, 10);
    const found = platform.steps.findIndex(s => s.id === stepId);
    if (found >= 0) activeIdx = found;
  } else if (state.activeStep[id] !== undefined) {
    activeIdx = state.activeStep[id];
  } else {
    // Find first incomplete
    const firstIncomplete = platform.steps.findIndex(s => !completed.has(s.id));
    activeIdx = firstIncomplete >= 0 ? firstIncomplete : 0;
  }
  if (activeIdx >= totalSteps) activeIdx = totalSteps - 1;
  state.activeStep[id] = activeIdx;

  const activeStep = platform.steps[activeIdx];

  function stepCard(step, idx) {
    const isDone = completed.has(step.id);
    const isActive = idx === activeIdx;
    const isLocked = idx > 0 && !completed.has(platform.steps[idx - 1].id) && !isDone && !isActive;

    return `
      <div
        class="step-card rounded-xl border-2 transition-all duration-200 cursor-pointer overflow-hidden
          ${isDone ? 'border-[#f8b4c3] bg-[#f8b4c3]/10' : isActive ? 'border-[#001e45] bg-white shadow-md' : 'border-gray-200 bg-white hover:border-gray-300'}"
        data-step-idx="${idx}"
        data-platform="${id}"
        id="step-card-${idx}"
      >
        <!-- Step header (always visible) -->
        <div class="flex items-center gap-3 p-4 select-none">
          <div class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold
            ${isDone ? 'bg-[#f8b4c3] text-[#001e45]' : isActive ? 'bg-[#001e45] text-white' : 'bg-gray-100 text-gray-500'}">
            ${isDone
              ? `<svg class="w-4 h-4 check-pop" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`
              : step.id}
          </div>
          <span class="font-medium text-sm flex-1 ${isDone ? 'text-gray-500 line-through' : isActive ? 'text-[#001e45]' : 'text-gray-700'}">${step.title}</span>
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0 transition-transform ${isActive ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>

        <!-- Step body (visible when active) -->
        <div class="step-body ${isActive ? 'print-expand' : ''}" ${isActive ? '' : 'style="display:none"'}>
          <div class="px-4 pb-5 space-y-4">
            <p class="text-gray-700 text-sm leading-relaxed">${step.body}</p>

            ${step.image ? `<img src="${step.image}" alt="${step.title}" class="w-full rounded-lg border border-gray-200 object-cover max-h-72" loading="lazy" onerror="this.style.display='none'" />` : ''}

            ${step.codeBlocks ? step.codeBlocks.map(cb => `
              <div>
                <p class="text-xs font-medium text-gray-500 mb-1">${cb.label}</p>
                <div class="relative group/code">
                  <pre class="bg-gray-950 text-green-400 text-xs rounded-lg px-4 py-3 font-mono leading-relaxed overflow-x-auto">${escHtml(cb.value)}</pre>
                  <button
                    class="no-print absolute top-2 right-2 opacity-0 group-hover/code:opacity-100 transition-opacity bg-gray-700 hover:bg-gray-600 text-white text-xs px-2 py-1 rounded"
                    data-copy="${escAttr(cb.value)}"
                  >Copy</button>
                </div>
              </div>
            `).join('') : ''}

            ${step.tip ? `
              <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 flex gap-2">
                <svg class="w-4 h-4 text-blue-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <p class="text-blue-700 text-xs leading-relaxed">${step.tip}</p>
              </div>
            ` : ''}

            <div class="flex flex-wrap items-center gap-2 pt-1 no-print">
              ${step.action ? `
                <a href="${step.action.href}" target="_blank" rel="noopener"
                  class="inline-flex items-center gap-1.5 text-sm bg-white border border-gray-200 text-[#001e45] font-medium px-3 py-1.5 rounded-lg hover:bg-gray-50 transition-colors">
                  ${step.action.label}
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
              ` : ''}

              <button
                class="inline-flex items-center gap-1.5 text-xs text-gray-400 hover:text-gray-600 px-2 py-1.5 rounded transition-colors"
                data-copy-link="${id}" data-copy-step="${step.id}"
                title="Copy link to this step"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                Copy link to step
              </button>

              <div class="flex-1"></div>

              ${isDone
                ? `<button data-uncomplete="${id}" data-step="${step.id}" class="text-xs text-gray-400 hover:text-gray-600 underline px-2 py-1.5 transition-colors">Mark incomplete</button>`
                : `<button data-complete="${id}" data-step="${step.id}" data-next-idx="${idx + 1 < totalSteps ? idx + 1 : -1}"
                    class="bg-[#001e45] text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-[#002d6b] transition-colors flex items-center gap-2">
                    ${idx + 1 < totalSteps ? 'Mark complete &amp; continue' : 'Mark complete'}
                    <svg class="w-4 h-4" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                  </button>`
              }
            </div>
          </div>
        </div>
      </div>
    `;
  }

  return `
    ${renderHeader()}
    <main class="max-w-2xl mx-auto px-4 py-8 print-full-width">

      <!-- Back + Print -->
      <div class="flex items-center justify-between mb-6 no-print">
        <button data-link="/setup" class="flex items-center gap-2 text-sm text-gray-500 hover:text-[#001e45] transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          All platforms
        </button>
        <button id="print-btn" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-[#001e45] transition-colors border border-gray-200 rounded-lg px-3 py-1.5 hover:border-gray-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          Print / Save PDF
        </button>
      </div>

      <!-- Platform header -->
      <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 rounded-xl ${platform.logoBg} flex items-center justify-center p-2.5 flex-shrink-0">
          ${LOGOS[id]}
        </div>
        <div>
          <h1 class="text-xl font-bold text-[#001e45]">${platform.name}</h1>
          <p class="text-gray-500 text-sm">${platform.description}</p>
        </div>
      </div>

      ${platform.connectionNote ? `
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 flex gap-3">
          <svg class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <p class="text-amber-800 text-sm">${platform.connectionNote}</p>
        </div>
      ` : ''}

      <!-- Progress bar -->
      <div class="mb-8">
        <div class="flex items-center justify-between text-xs text-gray-500 mb-1.5">
          <span>${completedCount} of ${totalSteps} steps complete</span>
          <span>${pct}%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="h-2 rounded-full transition-all duration-500 ${allDone ? 'bg-[#f8b4c3]' : 'bg-[#001e45]'}" style="width:${pct}%"></div>
        </div>
      </div>

      <!-- Steps -->
      ${allDone ? renderSuccessScreen(platform) : `
        <div class="space-y-3" id="steps-list">
          ${platform.steps.map((step, idx) => stepCard(step, idx)).join('')}
        </div>
      `}

    </main>
  `;
}

function renderSuccessScreen(platform) {
  return `
    <div class="text-center py-8">
      <div class="w-16 h-16 rounded-full bg-[#f8b4c3] flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="#001e45" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2 class="text-2xl font-bold text-[#001e45] mb-2">Integration complete!</h2>
      <p class="text-gray-600 mb-8">You've finished the ${platform.name} setup. Here's what to do next.</p>
    </div>

    <div class="space-y-3 mb-8">
      ${(platform.whatNext || []).map((item, i) => `
        <div class="bg-white rounded-xl border border-gray-200 p-5">
          <div class="flex items-start gap-3">
            <div class="w-6 h-6 rounded-full bg-[#f8b4c3] text-[#001e45] text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${i + 1}</div>
            <div class="flex-1">
              <h3 class="font-semibold text-gray-900 text-sm mb-1">${item.title}</h3>
              <p class="text-gray-600 text-sm leading-relaxed">${item.body}</p>
              ${item.action ? `
                <a href="${item.action.href}" target="_blank" rel="noopener"
                  class="inline-flex items-center gap-1.5 mt-2 text-sm text-[#001e45] font-medium hover:underline no-print">
                  ${item.action.label}
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="flex flex-wrap gap-3 no-print">
      <button data-link="/setup" class="bg-[#001e45] text-white font-medium px-5 py-2.5 rounded-lg hover:bg-[#002d6b] transition-colors">
        Back to all platforms
      </button>
      <button data-reset-platform="${platform.id}" class="text-gray-500 border border-gray-200 px-4 py-2.5 rounded-lg hover:bg-gray-50 text-sm transition-colors">
        Reset progress
      </button>
    </div>
  `;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escAttr(str) {
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  const existing = document.getElementById('tl-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'tl-toast';
  toast.className = 'fixed bottom-4 right-4 bg-gray-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg z-50 no-print';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2200);
}

// ─── RENDER ENGINE ───────────────────────────────────────────────────────────
function render() {
  const route = getRoute();
  const app = document.getElementById('app');

  if (route.page === 'home') {
    app.innerHTML = renderHome();
  } else if (route.page === 'migrate') {
    app.innerHTML = renderMigrate();
  } else if (route.page === 'setup') {
    app.innerHTML = renderSetup();
  } else if (route.page === 'platform') {
    app.innerHTML = renderPlatform(route.id, route.params);
  } else {
    app.innerHTML = renderHome();
  }

  // Scroll to top on navigation
  window.scrollTo(0, 0);
}

// ─── EVENT DELEGATION ────────────────────────────────────────────────────────
document.addEventListener('click', function(e) {
  const target = e.target.closest('[data-link]');
  if (target) {
    e.preventDefault();
    navigate(target.dataset.link);
    return;
  }

  // FAQ accordion
  const faqBtn = e.target.closest('[data-faq]');
  if (faqBtn) {
    const i = parseInt(faqBtn.dataset.faq, 10);
    state.faqOpen[i] = !state.faqOpen[i];
    const body = document.getElementById(`faq-body-${i}`);
    const chevron = document.getElementById(`faq-chevron-${i}`);
    if (body) {
      body.classList.toggle('open', state.faqOpen[i]);
      body.classList.toggle('closed', !state.faqOpen[i]);
    }
    if (chevron) {
      chevron.classList.toggle('rotate-180', state.faqOpen[i]);
    }
    return;
  }

  // Step card toggle (click header to expand/collapse)
  const stepCard = e.target.closest('[data-step-idx]');
  if (stepCard && !e.target.closest('[data-complete]') && !e.target.closest('[data-uncomplete]') && !e.target.closest('[data-copy-link]') && !e.target.closest('[data-copy]') && !e.target.closest('a') && !e.target.closest('button[data-complete]') && !e.target.closest('button[data-uncomplete]')) {
    const platformId = stepCard.dataset.platform;
    const newIdx = parseInt(stepCard.dataset.stepIdx, 10);
    if (state.activeStep[platformId] === newIdx) {
      // Collapse current
      state.activeStep[platformId] = -1;
    } else {
      state.activeStep[platformId] = newIdx;
    }
    render();
    // Scroll to opened step
    if (state.activeStep[platformId] >= 0) {
      setTimeout(() => {
        const el = document.getElementById(`step-card-${newIdx}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }
    return;
  }

  // Mark complete
  const completeBtn = e.target.closest('[data-complete]');
  if (completeBtn) {
    const platformId = completeBtn.dataset.complete;
    const stepId = parseInt(completeBtn.dataset.step, 10);
    const nextIdx = parseInt(completeBtn.dataset.nextIdx, 10);
    const completed = getCompleted(platformId);
    completed.add(stepId);
    state.completed[platformId] = completed;
    saveCompleted();
    if (nextIdx >= 0) {
      state.activeStep[platformId] = nextIdx;
    }
    render();
    if (nextIdx >= 0) {
      setTimeout(() => {
        const el = document.getElementById(`step-card-${nextIdx}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 50);
    }
    return;
  }

  // Mark incomplete
  const uncompleteBtn = e.target.closest('[data-uncomplete]');
  if (uncompleteBtn) {
    const platformId = uncompleteBtn.dataset.uncomplete;
    const stepId = parseInt(uncompleteBtn.dataset.step, 10);
    const completed = getCompleted(platformId);
    completed.delete(stepId);
    state.completed[platformId] = completed;
    saveCompleted();
    render();
    return;
  }

  // Reset platform
  const resetBtn = e.target.closest('[data-reset-platform]');
  if (resetBtn) {
    const platformId = resetBtn.dataset.resetPlatform;
    delete state.completed[platformId];
    delete state.activeStep[platformId];
    saveCompleted();
    render();
    return;
  }

  // Copy link to step
  const copyLinkBtn = e.target.closest('[data-copy-link]');
  if (copyLinkBtn) {
    const platformId = copyLinkBtn.dataset.copyLink;
    const stepId = copyLinkBtn.dataset.copyStep;
    const url = `${location.origin}${location.pathname}#/setup/${platformId}?step=${stepId}`;
    navigator.clipboard.writeText(url).then(() => showToast('Link copied to clipboard'));
    return;
  }

  // Copy code block
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const text = copyBtn.dataset.copy;
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
    return;
  }

  // Print button
  const printBtn = e.target.closest('#print-btn');
  if (printBtn) {
    // Expand all step bodies before printing
    document.querySelectorAll('.step-body').forEach(el => {
      el.style.display = '';
    });
    window.print();
    return;
  }
});

// ─── HASH ROUTING ────────────────────────────────────────────────────────────
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

// Fallback if DOMContentLoaded already fired
if (document.readyState !== 'loading') {
  render();
}
</script>
</body>
</html>
